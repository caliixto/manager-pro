<header class="layout__header">
  <div class="manager">
    <img [src]="currentUser?.escudo || '/img/miteam.webp'" alt="Escudo del equipo" class="img__logo" />
    <span class="font-bold">{{currentUser?.nombreEquipo}}</span>
  </div>

  <div class="info">
    <div class="monedas-badge">
      <span class="icono-moneda">💰</span>
      <span class="cantidad">{{ monedasFormateadas }}</span>
    </div>

    <div class="notificaciones-wrapper">
      <div class="campana-click" (click)="toggleNotificaciones()">
        <i class="pi pi-bell"></i>
        <span class="badge-rojo" *ngIf="notificaciones().length > 0">{{ notificaciones().length }}</span>
      </div>

      <div class="notificaciones-dropdown" *ngIf="notificacionesAbierto">
        <div class="notificaciones-header">
          <h4>Recompensas</h4>
        </div>

        <div class="notificaciones-lista" *ngIf="notificaciones().length > 0">
          <div class="notificacion-item" *ngFor="let n of notificaciones()">
            <span class="notificacion-mensaje">{{ n.mensaje }}</span>
          </div>
        </div>

        <p class="notificaciones-vacio" *ngIf="notificaciones().length === 0">
          No tienes recompensas pendientes.
        </p>

        <button
          class="btn-reclamar"
          *ngIf="notificaciones().length > 0"
          (click)="reclamarTodas()"
          [disabled]="reclamando()"
        >
          {{ reclamando() ? 'Reclamando...' : '💰 Reclamar todo' }}
        </button>
      </div>
    </div>
    
    <div class="user-profile-wrapper">
      <div class="user-profile" (click)="toggleMenu()">
        <img [src]="currentUser?.escudo || '/img/miteam.webp'" alt="Perfil">
        <i class="pi pi-chevron-down"></i>
      </div>

      <div class="user-dropdown" *ngIf="menuAbierto">
        <a routerLink="/perfil-equipo" class="dropdown-item" (click)="menuAbierto = false">
          <i class="pi pi-pencil"></i>
          Editar equipo
        </a>
        <button class="dropdown-item" (click)="logout()">
          <i class="pi pi-sign-out"></i>
          Cerrar sesión
        </button>
      </div>
    </div>
  </div>
</header>
