<form class="auth-form" #loginForm="ngForm" (ngSubmit)="onSubmit()">
  <h2>Bienvenido de nuevo</h2>
  <p class="form-subtitle">Introduce tus datos para acceder a tu panel</p>

  <div class="field">
    <label for="login-email">Correo electrónico</label>
    <input 
      id="login-email"
      type="email" 
      name="email"
      [(ngModel)]="email" 
      #emailField="ngModel"
      placeholder="tucorreo@ejemplo.com"
      required
      email>
    <p class="field-error" *ngIf="emailField.invalid && emailField.touched">
      Introduce un correo electrónico válido.
    </p>
  </div>

  <div class="field">
    <label for="login-password">Contraseña</label>
    <input 
      id="login-password"
      type="password" 
      name="password"
      [(ngModel)]="password" 
      #passwordField="ngModel"
      placeholder="••••••••"
      required>
    <p class="field-error" *ngIf="passwordField.invalid && passwordField.touched">
      La contraseña es obligatoria.
    </p>
  </div>

  <a href="" class="forgot-link" (click)="forgotPassword.emit(); $event.preventDefault()">
    ¿Olvidaste tu contraseña?
  </a>

  <p *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</p>
  <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
    Iniciar Sesión
  </button>
</form>
